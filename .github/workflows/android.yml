name: android
on:
  push:
    paths: ["android/**", "spec/test-vectors/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "spec/test-vectors/**"]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (spec vectors + daily rules)
        run: ./gradlew :core:test --console=plain
      - name: Build the app (debug APK)
        if: hashFiles('android/app/build.gradle.kts') != ''
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Upload the debug APK
        if: hashFiles('android/app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: riji-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
