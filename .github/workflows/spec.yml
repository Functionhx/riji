name: spec
on:
  push:
    paths: ["spec/**", ".github/workflows/spec.yml"]
  pull_request:
    paths: ["spec/**"]
permissions:
  contents: read
jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify test vectors (and that regenerating them changes nothing)
        run: node spec/reference/verify-vectors.mjs
